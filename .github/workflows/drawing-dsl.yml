name: Drawing DSL

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: drawing-dsl-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  XDG_CACHE_HOME: /tmp/folio-cache

jobs:
  fast-gate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libcairo2 libgdk-pixbuf-2.0-0 libglib2.0-0
          libpango-1.0-0 libpangoft2-1.0-0 librsvg2-bin
          poppler-utils shared-mime-info unzip zip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Configure deterministic build identity
        run: git config user.name "Folio CI"
      - name: Lint Python sources
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.5
          ruff check .
      - name: Diagnose dependencies
        run: python scripts/folio.py doctor
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Exercise V4 authoring CLI
        run: |
          python scripts/folio.py list-diagram-types --format json > "${RUNNER_TEMP}/diagram-types.json"
          python scripts/folio.py init-drawing timeline --output "${RUNNER_TEMP}/timeline.json"
          python scripts/folio.py init-drawing sequence --output "${RUNNER_TEMP}/sequence.json"
          python scripts/folio.py validate-drawing "${RUNNER_TEMP}/timeline.json" --format json > "${RUNNER_TEMP}/timeline-validation.json"
          python scripts/folio.py validate-drawing "${RUNNER_TEMP}/sequence.json" --format json > "${RUNNER_TEMP}/sequence-validation.json"
          python scripts/folio.py validate-drawing-schema references/fixtures/v5/heatmap.json
          python scripts/folio.py validate-drawing-schema references/fixtures/drawing/agent-runtime.drawing.json
          python scripts/folio.py import-chart-data references/fixtures/tabular/bar-import.json --output "${RUNNER_TEMP}/bar-imported.json"
          python scripts/folio.py validate-drawing "${RUNNER_TEMP}/bar-imported.json" --format json > "${RUNNER_TEMP}/bar-imported-validation.json"
          python scripts/folio.py batch-render-drawings references/fixtures/minimal --output-dir "${RUNNER_TEMP}/minimal-batch" --report-format json --report-output "${RUNNER_TEMP}/minimal-batch-report.json"
          python scripts/build.py --verify host-a4-long-doc
          python scripts/build.py --verify host-letter-document
          python scripts/build.py --verify host-a4-chinese
          python scripts/build.py --verify host-slide-16x9
      - name: Check templates and tokens
        run: python scripts/build.py --check
      - name: Check token drift across templates
        run: python scripts/build.py --sync
      - name: Check published HTML for unfilled placeholders
        run: python scripts/build.py --check-placeholders
      - name: Check slide deck rhythm
        run: python scripts/build.py --check-rhythm
      - name: Check stabilization converges and is idempotent
        run: python scripts/stabilize.py resume changelog --check
      - name: Validate profiles against the repository
        run: python scripts/profile_check.py
      - name: Validate the document corpus
        run: |
          python scripts/corpus.py validate
          python scripts/corpus.py coverage
      - name: Check the Document IR schema and model
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import document_ir
          from document_ir.model import Document
          from document_ir.validate import validate
          print(f"OK: Document IR imports, {len(document_ir.__all__)} public types")
          PY
      - name: Resolve the document style and trace every value
        run: >-
          python scripts/style_resolver.py resolve
          --genre one-pager --lang zh-Hans-CN
      - name: Check the spacing model is complete and explained
        run: python scripts/spacing.py pairs
      - name: Check the asset manifest resolves
        run: python scripts/assets.py check
      - name: Check every coverage class has a fixture
        run: python scripts/corpus_matrix.py gaps
      - name: Compare rendered spacing with the model
        run: python scripts/spacing_probe.py compare --genre one-pager
      - name: Record the build conditions
        run: python scripts/build_manifest.py show
      - name: Check verification leaves the workspace alone
        run: |
          python scripts/build.py --verify one-pager
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: verification wrote to tracked files"
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: verification is read-only"
      - name: Report what may be claimed about each language
        run: python scripts/language_support.py report
      - name: Confirm a language without fixtures makes no claim
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import language_support

          claimed = [
              s.tag for s in language_support.survey()
              if s.level == "supported" and s.fixtures == 0
          ]
          if claimed:
              print(f"ERROR: these languages are claimed without evidence: {claimed}")
              raise SystemExit(1)
          print("OK: every supported language has a fixture behind it")
          PY
      - name: Check corpus coverage against the plan's matrix
        run: python scripts/corpus_matrix.py report
      - name: Show the per-type migration matrix
        run: python scripts/migration.py matrix
      - name: Check the style projection layer
        run: python scripts/projection.py check
      - name: Check every capability is reachable from a production path
        run: python scripts/architecture.py check
      - name: Build a document with the projection and confirm the page count
        run: |
          python scripts/document_build.py build --genre one-pager --lang zh --out dist/projected
          python scripts/document_build.py build --genre one-pager --lang zh --out dist/unprojected
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from pypdf import PdfReader
          pages = {}
          for name in ("projected", "unprojected"):
              pdf = next(Path(f"dist/{name}").glob("*.pdf"))
              pages[name] = len(PdfReader(str(pdf)).pages)
          if pages["projected"] != pages["unprojected"]:
              print(f"ERROR: the projection changed the page count: {pages}")
              raise SystemExit(1)
          print(f"OK: projection keeps the page count at {pages['projected']}")
          PY
      - name: Render a smoke sample of the corpus
        run: >-
          python scripts/corpus.py render
          minimal-zh-changelog minimal-mixed-changelog canonical-mixed-one-pager
      - name: Inspect rendered artifacts for measurable quality
        run: |
          python scripts/artifact_inspector.py \
            assets/examples/host-a4-long-doc.pdf \
            assets/examples/host-a4-chinese.pdf \
            assets/examples/host-letter-document.pdf
      - name: Validate registered catalog
        run: >-
          python -c "import sys; sys.path.insert(0, 'scripts');
          from diagram_catalog import load_catalog;
          load_catalog(); print('OK: registered catalog')"
      - name: Verify package contents
        run: bash scripts/package-skill.sh "${RUNNER_TEMP}/folio-fast.zip"

  release-gate:
    needs: fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The newest supported interpreter: release evidence should be
          # produced on the version most likely to expose forward-compat issues.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libcairo2 libgdk-pixbuf-2.0-0 libglib2.0-0
          libpango-1.0-0 libpangoft2-1.0-0 librsvg2-bin
          poppler-utils shared-mime-info unzip zip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Configure deterministic build identity
        run: git config user.name "Folio CI"
      - name: Run full tests
        run: python -m unittest discover -s tests
      - name: Render all V4 minimal fixtures
        run: >-
          python scripts/folio.py batch-render-drawings references/fixtures/minimal
          --output-dir "${RUNNER_TEMP}/minimal-batch"
          --format svg --profile artifact --report-format json
          --report-output "${RUNNER_TEMP}/minimal-batch-report.json"
      - name: Compare approved drawing baseline
        run: >-
          python scripts/folio.py diagram-catalog
          --output-dir "${RUNNER_TEMP}/catalog"
          --contact-sheet "${RUNNER_TEMP}/drawing-all.png"
          --supported-sheet "${RUNNER_TEMP}/drawing-supported.png"
          --baseline references/fixtures/drawing/catalog-baseline-v3.json
          --baseline-report "${RUNNER_TEMP}/catalog-baseline-report.json"
      - name: Verify all build targets
        run: python scripts/build.py --verify
      - name: Check every target stabilizes within contract and idempotently
        run: python scripts/stabilize.py all --check
      - name: Render the full document corpus
        run: |
          python scripts/corpus.py render \
            --format json --output dist/reports/corpus.json --keep dist/corpus
      - name: Compare the legacy and IR paths for every fixture
        run: |
          python scripts/shadow.py compare \
            --format json --output dist/reports/shadow.json --keep dist/shadow
      - name: Confirm the build conditions are recorded
        run: |
          python scripts/build_manifest.py write dist/reports/build-manifest.json
          python scripts/build_manifest.py show
      - name: Confirm the font manifest is controlled
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import build_manifest

          manifest = build_manifest.capture()
          payload = manifest.to_json()
          if not payload.get("font_manifest_hash"):
              print("ERROR: no font manifest hash; fonts are not controlled")
              raise SystemExit(1)
          print(f"OK: font manifest {payload['font_manifest_hash'][:16]}")
          PY
      - name: Confirm repeated renders agree
        run: >-
          python scripts/determinism.py
          --repeat 3 --format json --output dist/reports/determinism.json
      - name: Confirm every mode can be left by configuration
        run: python scripts/pipeline.py rollback-drill --output dist/reports/rollback.json
      - name: Confirm the accessibility dimension was measured
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from quality_vector import evaluate

          pdf = Path("assets/examples/one-pager.pdf")
          if not pdf.is_file():
              print("ERROR: no built example to measure")
              raise SystemExit(1)
          vector = evaluate(pdf, "one-pager")
          names = {d.name for d in vector.dimensions}
          for required in ("accessibility", "pdf_ua", "correctness"):
              if required not in names:
                  print(f"ERROR: the {required} dimension is missing")
                  raise SystemExit(1)
          print(f"OK: {len(vector.dimensions)} quality dimension(s) reported")
          PY
      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-corpus-evidence
          if-no-files-found: warn
          path: |
            dist/reports/corpus.json
            dist/corpus/**/*.pdf
      - name: Report the quality vector for every document
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from page_contracts import HTML_TARGETS

          entries = []
          for target, spec in HTML_TARGETS.items():
              pdf = Path("assets/examples") / f"{target}.pdf"
              if pdf.is_file():
                  entries.append({"path": str(pdf), "genre": target})
          Path("dist/reports").mkdir(parents=True, exist_ok=True)
          suite = Path("dist/reports/quality-suite.json")
          suite.write_text(json.dumps(entries, indent=2))
          print(f"OK: {len(entries)} document(s) queued for quality review")
          PY
          python scripts/quality_vector.py --suite dist/reports/quality-suite.json \
            --output dist/reports/quality-vector.json
      - name: Check orphan text in generated PDFs
        run: python scripts/build.py --check-orphans
      - name: Check built host documents for unfilled placeholders
        run: python scripts/build.py --check-placeholders
      - name: Build release package
        run: bash scripts/package-skill.sh "${RUNNER_TEMP}/folio.zip"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-dsl-release-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/catalog-baseline-report.json
            ${{ runner.temp }}/drawing-all.png
            ${{ runner.temp }}/drawing-supported.png
            ${{ runner.temp }}/minimal-batch-report.json
            assets/examples/host-a4-long-doc.pdf
            assets/examples/host-letter-document.pdf
            assets/examples/host-a4-chinese.pdf
            assets/examples/host-slide-16x9.pptx
            ${{ runner.temp }}/folio.zip

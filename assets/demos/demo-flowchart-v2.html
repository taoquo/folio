<!DOCTYPE html>
<!-- folio-theme: folio-classic-v1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drawing Review Flow Demo</title>
<style>
  @font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4Variable-Roman.ttf") format("truetype"); font-weight: 200 900; font-style: normal; }
  :root {
    --color-surface-page: #F6F0EA;
    --color-surface-card: #FBF7F3;
    --color-text-primary: #191514;
    --color-text-secondary: #5A4A43;
    --color-text-muted: #756A63;
    --color-accent-brand: #B83D2E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--color-surface-page);
    color: var(--color-text-primary);
    font-family: "Source Serif 4", Charter, Georgia, serif;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--color-text-muted);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.15;
  }

  .frame {
    padding: 20px;
    background: var(--color-surface-card);
    border: 1px solid #E6DACD;
  }

  img {
    display: block;
    width: 100%;
    height: auto;
  }

  .caption {
    margin: 14px 0 0;
    color: var(--color-text-secondary);
    font-size: 15px;
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Drawing DSL</p>
    <h1>Drawing Review Flow</h1>
    <div class="frame">
      <img src="../diagrams/generated/png/flowchart-v2-demo.png" alt="Flowchart for deterministic drawing review">
    </div>
    <p class="caption">A typed Flowchart artifact with decisions, branch labels, orthogonal routing, accessible SVG metadata, and deterministic validation.</p>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="drawing-title drawing-description" lang="en"><title id="drawing-title">Document Build Request</title><desc id="drawing-description">Sequence Document Build Request. Participants: Author, Compiler, Artifact Store. Messages: author to compiler: Submit source (sync); compiler to store: Write artifact (async); store to compiler: Artifact URI (return); compiler to author: Build complete (return)</desc><rect width="960" height="540" fill="#F6F0EA" /><text x="480" y="40" fill="#191514" font-size="24" font-family="Charter, Georgia, serif" text-anchor="middle">Document Build Request</text><g id="participant:author" role="listitem" data-reading-order="0"><rect id="participant-box:author" x="36" y="72" width="128" height="44" rx="4" fill="#FBF7F3" stroke="#191514" stroke-width="1" /><text x="100" y="98" fill="#191514" font-size="10" font-family="Charter, Georgia, serif" text-anchor="middle" font-weight="500">Author</text><text x="100" y="110" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.1em">ACTOR</text></g><line id="lifeline:author" x1="100" y1="116" x2="100" y2="492" fill="none" stroke="#E9DED4" stroke-width="1" stroke-dasharray="6 4" /><g id="participant:compiler" role="listitem" data-reading-order="1"><rect id="participant-box:compiler" x="416" y="72" width="128" height="44" rx="4" fill="#FBF7F3" stroke="#B83D2E" stroke-width="1" /><text x="480" y="98" fill="#B83D2E" font-size="10" font-family="Charter, Georgia, serif" text-anchor="middle" font-weight="500">Compiler</text><text x="480" y="110" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.1em">SYSTEM</text></g><line id="lifeline:compiler" x1="480" y1="116" x2="480" y2="492" fill="none" stroke="#E9DED4" stroke-width="1" stroke-dasharray="6 4" /><g id="participant:store" role="listitem" data-reading-order="2"><rect id="participant-box:store" x="796" y="72" width="128" height="44" rx="4" fill="#FBF7F3" stroke="#191514" stroke-width="1" /><text x="860" y="98" fill="#191514" font-size="10" font-family="Charter, Georgia, serif" text-anchor="middle" font-weight="500">Artifact Store</text><text x="860" y="110" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.1em">STORE</text></g><line id="lifeline:store" x1="860" y1="116" x2="860" y2="492" fill="none" stroke="#E9DED4" stroke-width="1" stroke-dasharray="6 4" /><g id="message:submit" role="listitem" data-reading-order="3"><line id="message-line:submit" x1="100" y1="148" x2="480" y2="148" fill="none" stroke="#B83D2E" stroke-width="1.2" /><path id="message-head:submit" d="M 480 148 L 468 141 L 468 155 Z" fill="#B83D2E" stroke="#B83D2E" stroke-width="1.2" /><text x="288" y="142" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Submit source</text></g><g id="message:persist" role="listitem" data-reading-order="4"><line id="message-line:persist" x1="480" y1="176" x2="860" y2="176" fill="none" stroke="#5A4A43" stroke-width="1.2" /><polyline id="message-head:persist" points="852,172 860,176 852,180" fill="none" stroke="#5A4A43" stroke-width="1.2" /><text x="672" y="170" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Write artifact</text></g><g id="message:stored" role="listitem" data-reading-order="5"><line id="message-line:stored" x1="860" y1="204" x2="480" y2="204" fill="none" stroke="#5A4A43" stroke-width="1.2" stroke-dasharray="5 4" /><polyline id="message-head:stored" points="488,200 480,204 488,208" fill="none" stroke="#5A4A43" stroke-width="1.2" /><text x="672" y="198" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Artifact URI</text></g><g id="message:complete" role="listitem" data-reading-order="6"><line id="message-line:complete" x1="480" y1="232" x2="100" y2="232" fill="none" stroke="#5A4A43" stroke-width="1.2" stroke-dasharray="5 4" /><polyline id="message-head:complete" points="108,228 100,232 108,236" fill="none" stroke="#5A4A43" stroke-width="1.2" /><text x="288" y="226" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Build complete</text></g></svg>
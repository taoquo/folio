<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="drawing-title drawing-description" lang="en"><title id="drawing-title">Document Publishing Data</title><desc id="drawing-description">ER diagram Document Publishing Data. Entities: Author with fields id uuid, name text; Document with fields id uuid, author_id uuid, title text; Artifact with fields id uuid, document_id uuid, uri text. Relationships: author one to document many: authors; document one to artifact one-or-many: publishes</desc><rect width="960" height="640" fill="#F6F0EA" /><text x="480" y="40" fill="#191514" font-size="24" font-family="Charter, Georgia, serif" text-anchor="middle">Document Publishing Data</text><g id="relationship:authors" role="listitem" data-reading-order="3"><polyline id="relationship-line:authors" points="384,200 480,200 576,200" fill="none" stroke="#5A4A43" stroke-width="1.2" /><text x="392" y="194" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace">1</text><text x="568" y="194" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">*</text><text x="432" y="192" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">authors</text></g><g id="relationship:publishes" role="listitem" data-reading-order="4"><polyline id="relationship-line:publishes" points="692,264 692,328 268,328 268,388" fill="none" stroke="#5A4A43" stroke-width="1.2" /><text x="700" y="258" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace">1</text><text x="260" y="382" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">1..*</text><text x="480" y="320" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">publishes</text></g><g id="entity:author" role="listitem" data-reading-order="0"><rect id="item-box:author" x="152" y="152" width="232" height="100" rx="4" fill="#FBF7F
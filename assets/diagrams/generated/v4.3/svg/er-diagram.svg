y="'JetBrains Mono', monospace" text-anchor="end">uuid</text><text x="586" y="246" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace"></text><text x="614" y="246" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace">title</text><text x="798" y="246" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">text</text></g><g id="entity:artifact" role="listitem" data-reading-order="2"><rect id="item-box:artifact" x="152" y="388" width="232" height="124" rx="4" fill="#FBF7F3" stroke="#191514" stroke-width="1" /><line id="item-header:artifact" x1="152" y1="424" x2="384" y2="424" fill="none" stroke="#E9DED4" stroke-width="1" /><text x="268" y="412" fill="#191514" font-size="11" font-family="Charter, Georgia, serif" text-anchor="middle" font-weight="500">Artifact</text><text x="162" y="446" fill="#B83D2E" font-size="7" font-family="'JetBrains Mono', monospace">PK</text><text x="190" y="446" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace">id</text><text x="374" y="446" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">uuid</text><text x="162" y="470" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace">FK</text><text x="190" y="470" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace">document_id</text><text x="374" y="470" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">uuid</text><text x="162" y="494" fill="#85776F" font-size="7" font-family="'JetBrains Mono', monospace"></text><text x="190" y="494" fill="#191514" font-size="8" font-family="'JetBrains Mono', monospace">uri</text><text x="374" y="494" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">text</text></g></svg>
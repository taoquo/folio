<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="drawing-title drawing-description" lang="en"><title id="drawing-title">Drawing Grammar Migration Lifecycle</title><desc id="drawing-description">State machine Drawing Grammar Migration Lifecycle. States: initial, Idle, Active, Processing, Done, final.</desc><rect width="960" height="540" fill="#F6F0EA" /><text x="480" y="40" fill="#191514" font-size="24" font-family="Charter, Georgia, serif" text-anchor="middle">Drawing Grammar Migration Lifecycle</text><path class="state-machine-edge state-machine-edge--normal" d="M 72 272 L 80 272 Q 88 272 88 268 L 88 266 Q 88 264 96 264 L 120 264" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 112 260 L 120 264 L 112 268" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" /><path class="state-machine-edge state-machine-edge--focal" d="M 264 272 L 312 272" fill="none" stroke="#B83D2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 304 268 L 312 272 L 304 276" fill="none" stroke="#B83D2E" stroke-width="1.4" stroke-linecap="round" /><rect class="arch-edge-label-mask" x="264" y="260" width="52" height="24" rx="3" fill="#F6F0EA" stroke="none" /><text x="288" y="276" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">trigger</text><path class="state-machine-edge state-machine-edge--normal" d="M 456 272 L 504 272" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 496 268 L 504 272 L 496 276" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" /><rect class="arch-edge-label-mask" x="456" y="260" width="48" height="24" rx="3" fill="#F6F0EA" stroke="none" /><text x="480" y="276" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">submit</text><path class="state-machine-edge state-machine-edge--normal" d="M 648 264 L 656 264 Q 664 264 664 268 L 664 270 Q 664 272 672 272 L 696 272" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 688 268 L 696 272 L 688 276" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" /><rect class="arch-edge-label-mask" x="652" y="260" width="56" height="24" rx="3" fill="#F6F0EA" stroke="none" /><text x="680" y="276" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">complete</text><path class="state-machine-edge state-machine-edge--normal" d="M 840 272 L 888 272" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 880 268 L 888 272 L 880 276" fill="none" stroke="#5A4A43" stroke-width="1.4" stroke-linecap="round" /><path class="state-machine-edge state-machine-edge--reset" d="M 584 240 L 584 148 Q 584 140 576 140 L 208 140 Q 200 140 200 148 L 200 240" fill="none" stroke="#85776F" stroke-width="1.4" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 196 232 L 200 240 L 204 232" fill="none" stroke="#85776F" stroke-width="1.4" stroke-linecap="round" /><rect class="arch-edge-label-mask" x="368" y="128" width="48" height="24" rx="3" fill="#F6F0EA" stroke="none" /><text x="392" y="144" fill="#85776F" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">reset</text><g id="initial" data-reading-order="0"><circle cx="64" cy="272" r="8" fill="#FBF7F3" stroke="#191514" stroke-width="1.2" /></g><g id="idle" data-reading-order="1"><rect x="120" y="240" width="144" height="64" rx="6" fill="#FBF7F3" stroke="#191514" stroke-width="1.2" /><text x="192" y="272" fill="#191514" font-size="12" font-family="Charter, Georgia, serif" text-anchor="middle" font-weight="500">Idle</text><text x="192" y="296" fill="#5A4A43" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">
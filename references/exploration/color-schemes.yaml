# Candidate colour schemes
#
# Exploration only. Nothing here is wired into the engine: `scripts/build_color_schemes.py`
# reads this file, renders each scheme over real content, and writes a page where
# the schemes can be compared side by side.
#
# A scheme is a full set of the variables the templates declare. Names match
# `assets/templates/*.html` and the theme profile, so adopting one is a matter of
# copying its values into `references/profiles/theme/`.
#
# Each scheme states a direction rather than a palette tweak, because the point
# of the comparison is to choose a direction. Contrast ratios are computed from
# these values and printed on the page; a scheme that fails is shown as failing
# rather than quietly corrected.
#
# Conventions held constant across schemes, so the comparison isolates colour:
#   - `status-positive` uses the scheme's own accent, the way the shipped theme
#     does, so a reader who reads red as a gain is not silently switched to green.
#   - `status-negative` is a cool slate in every scheme.
#   - Body text sits on `parchment`; `ivory` is the card surface.

version: 1

schemes:
  - id: warm-classic
    label: 暖羊皮纸 · 朱砂（现状）
    rationale: >-
      当前主题。羊皮纸画布、暖中性色、朱砂作为唯一彩色。整体偏暖偏软，
      长文档阅读舒适，但页面密度高时对比度偏弱。
    shipped: true
    tokens:
      parchment: "#F6F0EA"
      ivory: "#FBF7F3"
      sand: "#E9DED4"
      near-black: "#191514"
      dark-warm: "#3A312D"
      olive: "#5A4A43"
      stone: "#85776F"
      brand: "#B83D2E"
      brand-tint: "#F7E6E1"
      tag-bg: "#F1D2CC"
      border: "#E9DED4"
      border-soft: "#E8DED6"
      rule-warm: "#e3baa9"
      status-positive: "#B83D2E"
      status-caution: "#A8722C"
      status-negative: "#5A6B7A"
      status-informative: "#4A6B7A"
      status-positive-tint: "#F7E6E1"
      status-caution-tint: "#F6EBD9"
      status-negative-tint: "#E4E9ED"
      status-informative-tint: "#E3ECEF"

  - id: editorial-cool
    label: 冷调编辑 · 深蓝
    rationale: >-
      画布转为中性偏冷，强调色为深蓝。层级更清晰、密度高的页面更易读，
      适合技术文档与数据报告。代价是失去仓库当前的暖色识别。
    tokens:
      parchment: "#F2F3F5"
      ivory: "#FAFBFC"
      sand: "#E4E7EB"
      near-black: "#14181C"
      dark-warm: "#2C333A"
      olive: "#4A545E"
      stone: "#6F7A85"
      brand: "#1F5FA8"
      brand-tint: "#E4EDF7"
      tag-bg: "#D3E2F2"
      border: "#DFE3E8"
      border-soft: "#E7EAEE"
      rule-warm: "#C9D2DB"
      status-positive: "#1F5FA8"
      status-caution: "#9A6B12"
      status-negative: "#8C3B2E"
      status-informative: "#2A6E7A"
      status-positive-tint: "#E4EDF7"
      status-caution-tint: "#F5EBD8"
      status-negative-tint: "#F3E3E0"
      status-informative-tint: "#DFEDEF"

  - id: high-contrast
    label: 高对比 · 纯白纯黑
    rationale: >-
      白纸黑墨，强调色为深红。为打印与低质量输出优化，灰阶下层级最清楚。
      代价是屏幕阅读偏硬，暖色质感完全消失。
    tokens:
      parchment: "#FFFFFF"
      ivory: "#FFFFFF"
      sand: "#EDEDED"
      near-black: "#000000"
      dark-warm: "#1A1A1A"
      olive: "#333333"
      stone: "#595959"
      brand: "#B3001B"
      brand-tint: "#FBE9EC"
      tag-bg: "#F5D0D6"
      border: "#C9C9C9"
      border-soft: "#DCDCDC"
      rule-warm: "#B0B0B0"
      status-positive: "#B3001B"
      status-caution: "#7A5000"
      status-negative: "#1A4A7A"
      status-informative: "#1A4A7A"
      status-positive-tint: "#FBE9EC"
      status-caution-tint: "#F7EEDB"
      status-negative-tint: "#E2EAF3"
      status-informative-tint: "#E2EAF3"

  - id: ink-teal
    label: 暖纸 · 墨青
    rationale: >-
      保留暖纸，但强调色换成深青。冷暖并存，既有暖色的阅读舒适，
      又比朱砂更克制。适合研究报告与品牌文档。
    tokens:
      parchment: "#F4F1E9"
      ivory: "#FBF9F4"
      sand: "#E6E1D3"
      near-black: "#101C1B"
      dark-warm: "#243330"
      olive: "#3F5350"
      stone: "#6B7C78"
      brand: "#0F6F6A"
      brand-tint: "#E0F0EE"
      tag-bg: "#C9E5E2"
      border: "#E0DACB"
      border-soft: "#E8E3D6"
      rule-warm: "#C8BFA8"
      status-positive: "#0F6F6A"
      status-caution: "#8A5F10"
      status-negative: "#8C3B2E"
      status-informative: "#2A5F8A"
      status-positive-tint: "#E0F0EE"
      status-caution-tint: "#F4EBD6"
      status-negative-tint: "#F3E3E0"
      status-informative-tint: "#E1EAF3"

  - id: plum-editorial
    label: 浅梅白 · 深梅
    rationale: >-
      画布带极浅的梅调，强调色为深梅。偏文化与品牌气质，
      适合作品集、宣言、品牌文档；对财务类内容可能过于柔和。
    tokens:
      parchment: "#F8F3F6"
      ivory: "#FDFAFB"
      sand: "#EDE2E9"
      near-black: "#1A1218"
      dark-warm: "#33222E"
      olive: "#4E3C48"
      stone: "#7C6B76"
      brand: "#7A3E6B"
      brand-tint: "#F2E3EE"
      tag-bg: "#E6CEDF"
      border: "#E9DCE4"
      border-soft: "#EFE5EA"
      rule-warm: "#D8C2CF"
      status-positive: "#7A3E6B"
      status-caution: "#8A5F10"
      status-negative: "#3E5A7A"
      status-informative: "#4A5F8A"
      status-positive-tint: "#F2E3EE"
      status-caution-tint: "#F4EBD6"
      status-negative-tint: "#E2EAF3"
      status-informative-tint: "#E6EBF5"

  - id: graphite
    label: 石墨 · 近单色
    rationale: >-
      完全去掉彩色，只靠字重、字号与留白建立层级，强调用深灰。
      最克制，也最不依赖颜色；适合打印、法务与极简品牌。
      代价是失去所有色彩识别与状态提示能力。
    tokens:
      parchment: "#F4F4F2"
      ivory: "#FBFBFA"
      sand: "#E6E6E2"
      near-black: "#121212"
      dark-warm: "#2A2A2A"
      olive: "#4A4A4A"
      stone: "#6E6E6E"
      brand: "#2F2F2F"
      brand-tint: "#EDEDED"
      tag-bg: "#E0E0E0"
      border: "#DCDCD8"
      border-soft: "#E6E6E2"
      rule-warm: "#C4C4C0"
      status-positive: "#2F2F2F"
      status-caution: "#6E6E6E"
      status-negative: "#5A5A5A"
      status-informative: "#4A4A4A"
      status-positive-tint: "#EDEDED"
      status-caution-tint: "#EAEAEA"
      status-negative-tint: "#E4E4E4"
      status-informative-tint: "#E6E6E6"

# Contrast pairs checked for every scheme. The first two are body text; the rest
# are the places a document puts colour on colour.
contrast_pairs:
  - [near-black, parchment, 4.5, 正文 / 画布]
  - [near-black, ivory, 4.5, 正文 / 卡片]
  - [olive, parchment, 4.5, 次级文字 / 画布]
  - [stone, parchment, 4.5, 弱化文字 / 画布]
  - [brand, parchment, 4.5, 强调文字 / 画布]
  - [brand, brand-tint, 3.0, 强调文字 / 强调底]
  - [parchment, brand, 3.0, 反白文字 / 强调块]
  - [status-caution, parchment, 4.5, 警告文字 / 画布]
  - [border, parchment, 1.2, 细线 / 画布]

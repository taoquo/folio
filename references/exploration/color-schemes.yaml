# Candidate colour schemes
#
# Exploration only. Nothing here is wired into the engine: `scripts/build_color_schemes.py`
# reads this file, renders each scheme over real content, and writes a page where
# the schemes can be compared side by side.
#
# A scheme is a full set of the variables the templates declare. Names match
# `assets/templates/*.html` and the theme profile, so adopting one is a matter of
# copying its values into `references/profiles/theme/`.
#
# Each scheme states a direction rather than a palette tweak, because the point
# of the comparison is to choose a direction. Contrast ratios, greyscale
# separation and a colour-weakness check are computed from these values and
# printed on the page; a scheme that fails is shown as failing rather than
# quietly corrected.
#
# Conventions held constant across schemes, so the comparison isolates colour:
#   - `status-positive` uses the scheme's own accent, the way the shipped theme
#     does, so a reader who reads red as a gain is not silently switched to green.
#   - `status-negative` is a cool slate in every light scheme.
#   - Body text sits on `parchment`; `ivory` is the card surface.
#
# Where the later schemes come from:
#   Carbon's model is the one this repository already uses -- a theme is a full
#   set of token values and the roles never change between themes. Carbon ships
#   four themes spanning light and dark, so `dark-slate` is included.
#
#   The EU data visualisation guide is more specific: red and green weakness
#   affects about one in twelve European men, palettes built from red, orange,
#   brown and green are inaccessible to a significant share of readers, and the
#   reliable axis is lightness. That is why `blue-institutional`, `blue-amber`
#   and `lightness-ramp` exist, and why the shipped theme -- warm brown neutrals
#   with a red accent, and positive red beside caution brown -- is worth
#   measuring rather than assuming.


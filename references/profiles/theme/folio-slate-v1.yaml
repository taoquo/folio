version: 2
profiles:
  folio-slate-v1:
    palette:
      amber-100: '#F5EBD8'
      amber-600: '#8A5A16'
      amber-700: '#754C13'
      azure-100: '#E4EBF4'
      azure-150: '#D4DEED'
      azure-200: '#C3D2E6'
      azure-600: '#3A639A'
      azure-700: '#1F4E8C'
      ink: '#14181D'
      ivory: '#FAFBFC'
      parchment: '#F1F3F6'
      slate-200: '#D6D9DC'
      slate-300: '#C0C3C6'
      slate-500: '#898B8F'
      slate-600: '#6B6E72'
      slate-650: '#5C6672'
      slate-700: '#53565A'
      slate-800: '#3E4246'
    color:
      accent:
        brand:
          palette: azure-700
        brand-tint:
          palette: azure-100
        tag:
          palette: azure-200
      border:
        default:
          palette: slate-300
        soft:
          palette: slate-200
        warm:
          palette: slate-200
      series:
        1:
          palette: slate-700
        2:
          palette: slate-500
        3:
          palette: azure-200
        4:
          palette: azure-150
        5:
          palette: azure-100
        6:
          palette: slate-600
      # L2 content semantics: the meanings a *document* states (delivered,
      # risk, change...). They are not accents -- accents_per_document stays 1 --
      # and they are the same in every scheme, so one meaning keeps one colour
      # when the theme changes.
      semantic:
        delivered:
          palette: azure-700
        delivered-strong:
          palette: azure-700
        info:
          palette: slate-700
        info-strong:
          palette: slate-800
        component:
          palette: slate-650
        component-strong:
          palette: slate-800
        passed:
          palette: azure-600
        passed-strong:
          palette: azure-700
        attention:
          palette: amber-600
        attention-strong:
          palette: amber-700
        enhance:
          palette: slate-600
        enhance-strong:
          palette: slate-800
        risk:
          palette: slate-800
        risk-strong:
          palette: ink
        change:
          palette: amber-700
        change-strong:
          palette: amber-700
        input:
          palette: ink
        input-strong:
          palette: ink
        pending:
          palette: slate-500
        pending-strong:
          palette: slate-650
      status:
        caution:
          palette: amber-600
        caution-tint:
          palette: amber-100
        negative:
          palette: slate-650
        positive:
          palette: azure-700
      surface:
        card:
          palette: ivory
        page:
          palette: parchment
      text:
        muted:
          palette: slate-600
        primary:
          palette: ink
        secondary:
          palette: slate-700
        warm:
          palette: slate-800


version: 2
profiles:
  folio-forest-v1:
    palette:
      amber-100: '#F5EBD8'
      amber-600: '#8A5A16'
      amber-700: '#754C13'
      forest-200: '#DAD8D0'
      forest-300: '#C4C2BB'
      forest-500: '#8C8B85'
      forest-600: '#6E6D67'
      forest-650: '#6A6157'
      forest-700: '#565650'
      forest-800: '#41423C'
      ink: '#161813'
      ivory: '#FCFAF5'
      parchment: '#F5F2EA'
      pine-100: '#E3EDE6'
      pine-150: '#D1E1D6'
      pine-200: '#BFD5C7'
      pine-600: '#48705C'
      pine-700: '#2F5D46'
    color:
      accent:
        brand:
          palette: pine-700
        brand-tint:
          palette: pine-100
        tag:
          palette: pine-200
      border:
        default:
          palette: forest-300
        soft:
          palette: forest-200
        warm:
          palette: forest-200
      series:
        1:
          palette: forest-700
        2:
          palette: forest-500
        3:
          palette: pine-200
        4:
          palette: pine-150
        5:
          palette: pine-100
        6:
          palette: forest-600
      # L2 content semantics: the meanings a *document* states (delivered,
      # risk, change...). They are not accents -- accents_per_document stays 1 --
      # and they are the same in every scheme, so one meaning keeps one colour
      # when the theme changes.
      semantic:
        delivered:
          palette: pine-700
        delivered-strong:
          palette: forest-800
        info:
          palette: forest-700
        info-strong:
          palette: forest-800
        component:
          palette: forest-650
        component-strong:
          palette: forest-800
        passed:
          palette: pine-600
        passed-strong:
          palette: pine-700
        attention:
          palette: amber-600
        attention-strong:
          palette: amber-700
        enhance:
          palette: forest-600
        enhance-strong:
          palette: forest-800
        risk:
          palette: forest-800
        risk-strong:
          palette: ink
        change:
          palette: amber-700
        change-strong:
          palette: amber-700
        input:
          palette: ink
        input-strong:
          palette: ink
        pending:
          palette: forest-500
        pending-strong:
          palette: forest-650
      status:
        caution:
          palette: amber-600
        caution-tint:
          palette: amber-100
        negative:
          palette: forest-650
        positive:
          palette: pine-700
      surface:
        card:
          palette: ivory
        page:
          palette: parchment
      text:
        muted:
          palette: forest-600
        primary:
          palette: ink
        secondary:
          palette: forest-700
        warm:
          palette: forest-800


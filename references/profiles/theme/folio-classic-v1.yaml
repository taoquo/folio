# Theme profile
#
# Two layers, and the split is the point.
#
# `palette` holds each raw colour once. `color` holds the roles a document uses
# and points them at the palette. Five roles share the brand red -- the accent,
# the positive status, the first chart category, a step of the sequential ramp
# and the positive diverging pole -- and before this file existed they shared it
# by repeating the same hex five times. Changing it meant finding all five.
#
# A template reads `color`, never `palette`. The projection derives a CSS
# variable from each role's path: `color.surface.page` becomes
# `--color-surface-page`.
#
# Values are the ones the templates render with today, so this restructure does
# not move a page.
#
# A scheme may omit `status` (it inherits the accent) and `data` (it inherits a
# categorical order from the palette), so adopting a scheme does not require
# designing fourteen chart colours.

version: 2
profiles:
  folio-classic-v1:
    default: true
    palette:
      parchment: '#F6F0EA'
      ivory: '#FBF7F3'
      sand: '#E6DACD'
      ink: '#191514'
      warm-850: '#3A312D'
      warm-700: '#5A4A43'
      warm-600: '#756A63'
      cinnabar-600: '#B83D2E'
      cinnabar-100: '#F7E6E1'
      cinnabar-200: '#F1D2CC'
      amber-600: '#906327'
      slate-600: '#5A6B7A'
      amber-100: '#F6EBD9'
      cinnabar-800: '#7E241C'
      warm-300: '#e3baa9'
      warm-800: '#4B3E39'
      cinnabar-500: '#C97A63'
      warm-350: '#B9ACA3'
      sage-600: '#4A6B52'
      warm-500: '#8B8078'
      warm-200: '#E5DBCD'
      warm-650: '#74665F'
      warm-250: '#D7CBC2'
    color:
      surface:
        page:
          palette: parchment
        card:
          palette: ivory
      text:
        primary:
          palette: ink
        secondary:
          palette: warm-700
        muted:
          palette: warm-600
        warm:
          palette: warm-850
      border:
        default:
          palette: sand
        soft:
          palette: warm-200
        warm:
          palette: warm-300
      accent:
        brand:
          palette: cinnabar-600
        brand-tint:
          palette: cinnabar-100
        tag:
          palette: cinnabar-200
      status:
        positive:
          palette: cinnabar-600
        caution:
          palette: amber-600
        negative:
          palette: slate-600
        caution-tint:
          palette: amber-100
      series:
        '1':
          palette: warm-700
        '2':
          palette: warm-650
        '3':
          palette: warm-350
        '4':
          palette: warm-250
        '5':
          palette: cinnabar-100
        '6':
          palette: warm-500
    decoration:
      rule_width_pt: 0.5
      corner_radius_pt: 0
      hairline: '#E9DED4'
    overridable:
    - accent.brand
    - accent.brand-tint
    - status.positive
    - status.caution
    - status.negative
    - status.informative
invariants:
  palette: warm
  forbid_cool_grays: true
  accents_per_document: 1

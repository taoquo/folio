# Theme profile
#
# Two layers, and the split is the point.
#
# `palette` holds each raw colour once. `color` holds the roles a document uses
# and points them at the palette. Five roles share the brand red -- the accent,
# the positive status, the first chart category, a step of the sequential ramp
# and the positive diverging pole -- and before this file existed they shared it
# by repeating the same hex five times. Changing it meant finding all five.
#
# A template reads `color`, never `palette`. The projection derives a CSS
# variable from each role's path: `color.surface.page` becomes
# `--color-surface-page`.
#
# Values are the ones the templates render with today, so this restructure does
# not move a page.
#
# A scheme may omit `status` (it inherits the accent) and `data` (it inherits a
# categorical order from the palette), so adopting a scheme does not require
# designing fourteen chart colours.

version: 2
profiles:
  folio-classic-v1:
    default: true
    palette:
      parchment: '#F6F0EA'
      ivory: '#FBF7F3'
      sand: '#E9DED4'
      warm-100: '#E8DED6'
      ink: '#191514'
      warm-800: '#3A312D'
      warm-700: '#5A4A43'
      warm-500: '#85776F'
      cinnabar: '#B83D2E'
      cinnabar-100: '#F7E6E1'
      cinnabar-200: '#F1D2CC'
      amber-700: '#A8722C'
      slate-600: '#5A6B7A'
      teal-600: '#4A6B7A'
      amber-100: '#F6EBD9'
      slate-100: '#E4E9ED'
      teal-100: '#E3ECEF'
      teal-800: '#3D5A63'
      amber-800: '#8A5A16'
      plum-700: '#5C4A6B'
      coral-200: '#E5B9AE'
      coral-400: '#CE8474'
      cinnabar-700: '#7E241C'
      warm-200: '#e3baa9'
      warm-900: '#4B3E39'
    color:
      surface:
        page:
          palette: parchment
        card:
          palette: ivory
      text:
        primary:
          palette: ink
        secondary:
          palette: warm-700
        muted:
          palette: warm-500
        warm:
          palette: warm-800
      border:
        default:
          palette: sand
        soft:
          palette: warm-100
        warm:
          palette: warm-200
      accent:
        brand:
          palette: cinnabar
        tint:
          palette: cinnabar-100
        tag:
          palette: cinnabar-200
      status:
        positive:
          palette: cinnabar
        caution:
          palette: amber-700
        negative:
          palette: slate-600
        informative:
          palette: teal-600
        positive-tint:
          palette: cinnabar-100
        caution-tint:
          palette: amber-100
        negative-tint:
          palette: slate-100
        informative-tint:
          palette: teal-100
      data:
        category-1:
          palette: cinnabar
        category-2:
          palette: teal-800
        category-3:
          palette: amber-800
        category-4:
          palette: plum-700
        category-5:
          palette: warm-700
        category-6:
          palette: warm-900
        sequential-1:
          palette: cinnabar-100
        sequential-2:
          palette: coral-200
        sequential-3:
          palette: coral-400
        sequential-4:
          palette: cinnabar
        sequential-5:
          palette: cinnabar-700
        diverging-negative:
          palette: slate-600
        diverging-neutral:
          palette: sand
        diverging-positive:
          palette: cinnabar
    decoration:
      rule_width_pt: 0.5
      corner_radius_pt: 0
      hairline: '#E9DED4'
    overridable:
    - accent.brand
    - accent.tint
    - status.positive
    - status.caution
    - status.negative
    - status.informative
invariants:
  palette: warm
  forbid_cool_grays: true
  accents_per_document: 1

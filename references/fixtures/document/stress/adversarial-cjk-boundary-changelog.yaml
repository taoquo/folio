  "{{项目一句话描述}}": 用于触发禁则与断行边界的样本
  "{{作者}}": Folio
  "{{关键词}}": 禁则, 标点, 边界
  "{{一句话版本亮点}}": 连续标点与不可断长串的断行边界
  "{{摘要}}": 本样本刻意在行首与行尾放置禁则标点。它包含连续标点：，。、；：！？以及嵌套括号（【《「测试」》】）。同时包含不可断开的超长串：AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA，用于观察溢出行为。中文标点不应出现在行首，前括号不应出现在行尾。
  "{{新功能 1：一句话描述}}": 行首禁则：，。、；：！？）】》」
  "{{对应中文描述}}": 上述标点出现在行首即视为违规
  "{{新功能 2：一句话描述}}": 行尾禁则：（【《「
  "{{同上对应的中文描述}}": 上述标点出现在行尾即视为违规
  "{{新功能 3：一句话描述}}": 连续标点 ，。、；：！？ 的压缩与悬挂
  "{{修复 1：一句话描述}}": 超长不可断串导致的溢出
  "{{修复 2：一句话描述}}": 全角与半角混用的宽度差异
  "{{修复 3：一句话描述}}": 标点挤压后的对齐偏移
  "{{破坏性变更描述}}": 无

  "{{A quoted passage - user interview, expert perspective, or cited source.}}": "Technical Report: Document Typography Baseline"
  "{{SOURCE / PERSON}}": "Technical Report: Document Typography Baseline"
  "{{DATE}}": "2026-10-09"
  "{{Footnote: data definition, citation detail, or methodological limitation.}}": "Technical Report: Document Typography Baseline"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter Host Integration</title>
<style>
  @page { size: Letter; margin: 20mm 22mm 22mm 22mm; background: #F6F0EA; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #191514; background: #F6F0EA; font-family: Charter, Georgia, serif; font-size: 10pt; }
  h1 { margin: 0 0 6mm; font-size: 24pt; font-weight: 500; }
  figure { margin: 8mm 0 0; break-inside: avoid; }
  figcaption { margin-top: 2.1mm; color: #85776F; font-size: 9pt; }
</style>
</head>
<body>
  <h1>Letter Portrait Host</h1>
  <p>The milestone order remains legible inside the shorter Letter portrait safe area.</p>
  <figure data-folio-diagram-slot="milestones"><p>Timeline slot</p></figure>
</body>
</html>
